  <title id="title">Scientific figure palette reference</title>
  <desc id="desc">Qualitative, diverging, sequential, and editorial palette swatches with hexadecimal values.</desc>
  <rect width="1600" height="1060" fill="#FFFFFF"/>
  <g font-family="Times New Roman, Times, serif" fill="#222222">
